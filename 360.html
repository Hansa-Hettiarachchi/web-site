<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ours 360 Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Ours 360 vs 3DGS Comparison</h1>
        
        <div class="controls">
            <!-- Navigation buttons for comparison modes -->
            <div class="mode-selector">
                <a href="index.html" class="mode-btn">Ours</a>
                <button id="mode360_3DGS" class="mode-btn active">Ours 360 vs 3DGS</button>
                <button id="mode360_GT" class="mode-btn">Ours 360 vs GT</button>
                <button id="modeVideo" class="mode-btn" onclick="window.location.href='video.html'">Video Comparison</button>
            </div>
        </div>

        <!-- Grid container for multiple viewers -->
        <div class="viewers-grid">
            <!-- Viewer 1: Garden -->
            <div class="viewer-wrapper">
                <div class="container" data-viewer="1">
                    <div class="image-container">
                        <img class="slider-image" id="beforeImage1" src="Ours360/G1.png" alt="Ours 360" />
                        <img class="slider-image" id="afterImage1" src="3DGS/G1.png" alt="3DGS" />
                        <div class="overlay-label overlay-label-left" id="labelLeft1">3DGS</div>
                        <div class="overlay-label overlay-label-right" id="labelRight1">Ours 360</div>
                    </div>
                    <input type="range" min="2" max="98" value="50" class="slider" id="slider1">
                    <div class="slider-line"></div>
                    <div class="slider-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 256 256">
                            <rect width="256" height="256" fill="none"></rect>
                            <line x1="128" y1="40" x2="128" y2="216" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <line x1="96" y1="128" x2="16" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="48 160 16 128 48 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                            <line x1="160" y1="128" x2="240" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="208 96 240 128 208 160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="viewer-header">
                    <label for="imageSelect1">Scene 1 - Garden:</label>
                    <select id="imageSelect1" class="scene-selector">
                        <option value="G1">G1</option>
                    </select>
                </div>
            </div>

            <!-- Viewer 2: Bicycle -->
            <div class="viewer-wrapper">
                
                <div class="container" data-viewer="2">
                    <div class="image-container">
                        <img class="slider-image" id="beforeImage2" src="Ours360/B1.png" alt="Ours 360" />
                        <img class="slider-image" id="afterImage2" src="3DGS/B1.png" alt="3DGS" />
                        <div class="overlay-label overlay-label-left" id="labelLeft2">3DGS</div>
                        <div class="overlay-label overlay-label-right" id="labelRight2">Ours 360</div>
                    </div>
                    <input type="range" min="2" max="98" value="50" class="slider" id="slider2">
                    <div class="slider-line"></div>
                    <div class="slider-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 256 256">
                            <rect width="256" height="256" fill="none"></rect>
                            <line x1="128" y1="40" x2="128" y2="216" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <line x1="96" y1="128" x2="16" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="48 160 16 128 48 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                            <line x1="160" y1="128" x2="240" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="208 96 240 128 208 160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="viewer-header">
                    <label for="imageSelect2">Scene 2 - Bicycle:</label>
                    <select id="imageSelect2" class="scene-selector">
                        <option value="B1">B1</option>
                        <option value="B2">B2</option>
                        <option value="B3">B3</option>
                        <option value="B4">B4</option>
                    </select>
                </div>
            </div>

            <!-- Viewer 3: C-series -->
            <div class="viewer-wrapper">
                
                <div class="container" data-viewer="3">
                    <div class="image-container">
                        <img class="slider-image" id="beforeImage3" src="Ours360/C1.png" alt="Ours 360" />
                        <img class="slider-image" id="afterImage3" src="3DGS/C1.png" alt="3DGS" />
                        <div class="overlay-label overlay-label-left" id="labelLeft3">3DGS</div>
                        <div class="overlay-label overlay-label-right" id="labelRight3">Ours 360</div>
                    </div>
                    <input type="range" min="2" max="98" value="50" class="slider" id="slider3">
                    <div class="slider-line"></div>
                    <div class="slider-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 256 256">
                            <rect width="256" height="256" fill="none"></rect>
                            <line x1="128" y1="40" x2="128" y2="216" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <line x1="96" y1="128" x2="16" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="48 160 16 128 48 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                            <line x1="160" y1="128" x2="240" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="208 96 240 128 208 160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="viewer-header">
                    <label for="imageSelect3">Scene 3 - C-series:</label>
                    <select id="imageSelect3" class="scene-selector">
                        <option value="C1">C1</option>
                        <option value="C2">C2</option>
                        <option value="C3">C3</option>
                        <option value="C4">C4</option>
                        <option value="C5">C5</option>
                    </select>
                </div>
            </div>

            <!-- Viewer 4: N-series -->
            <div class="viewer-wrapper">
                
                <div class="container" data-viewer="4">
                    <div class="image-container">
                        <img class="slider-image" id="beforeImage4" src="Ours360/N1.png" alt="Ours 360" />
                        <img class="slider-image" id="afterImage4" src="3DGS/N1.png" alt="3DGS" />
                        <div class="overlay-label overlay-label-left" id="labelLeft4">3DGS</div>
                        <div class="overlay-label overlay-label-right" id="labelRight4">Ours 360</div>
                    </div>
                    <input type="range" min="2" max="98" value="50" class="slider" id="slider4">
                    <div class="slider-line"></div>
                    <div class="slider-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 256 256">
                            <rect width="256" height="256" fill="none"></rect>
                            <line x1="128" y1="40" x2="128" y2="216" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <line x1="96" y1="128" x2="16" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="48 160 16 128 48 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                            <line x1="160" y1="128" x2="240" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
                            <polyline points="208 96 240 128 208 160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="viewer-header">
                    <label for="imageSelect4">Scene 4 - N-series:</label>
                    <select id="imageSelect4" class="scene-selector">
                        <option value="N1">N1</option>
                        <option value="N2">N2</option>
                        <option value="N3">N3</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

    <script src="360-script.js"></script>
</body>
</html>
